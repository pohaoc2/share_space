# Model Architecture
model:
  sim_chans: 8
  exp_chans: 3
  img_size: 240
  patch_size: 8
  embed_dim: 64
  depth: 2
  num_heads: 2
  decoder_type: conv  # Options: 'conv', 'transformer'

diffusion:
  unet_config: {
    in_channels: 4, # embed_channels
    out_channels: 4, # latent_channels
    model_channels: 64, # diffusion_model_channels
    num_res_blocks: 1,
    attention_resolutions: [2],
    channel_mult: [1, 2, 4],
    num_heads: 4
  }
  timesteps: 500
  beta_start: 0.0001
  beta_end: 0.02

# Training Parameters
training:
  stage_1:
    eval_only: false
    epochs: 1
    learning_rate: 0.0001
    weight_decay: 0.05
    teacher_momentum: 0.996
    mask_ratio: 0.5
    save_dir: ./checkpoints/stage_1
    load_path: ./checkpoints/stage_1/best_model.pth
    eval_every: 1
  stage_2:
    eval_only: false
    epochs: 1
    learning_rate: 0.0001
    weight_decay: 0.05
    teacher_momentum: 0.996
    mask_ratio: 0.5
    save_dir: ./checkpoints/stage_2
    load_path: ./checkpoints/stage_2/best_model.pth
    eval_every: 1
    use_diffusion: true
# Loss Weights
loss:
  recon_weight: 1.0
  distill_weight: 1.0
  mask_weight: 1.0
  diffusion_weight: 1.0
  content_weight: 1.0
  style_weight: 5.0
  element_weight: 1.0
  diffusion_weight: 1.0

# Data Configuration
data:
  exp_dir: ../../data/exp
  sim_dir: ../../data/sim
  batch_size: 16
  val_samples: 10
  num_workers: 4
  train_split: 0.9

# Visualization
visualization:
  style_transfer:
    save_dir: ./visualization/style_transfer/
    n_viz: 3
  reconstructed_images:
    save_dir: ./visualization/reconstructed_images/
    n_viz: 3